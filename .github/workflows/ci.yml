name: Eradiate test

on:
  workflow_dispatch:
  pull_request:

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get install -y clang-17 libc++-17-dev libc++abi-17-dev cmake ninja-build
          sudo apt-get install -y libpng-dev libjpeg-dev
          sudo apt-get install -y libpython3-dev python3-setuptools
          sudo apt-get install -y python3-pytest python3-pytest-xdist python3-numpy
          python -m pip install --upgrade pip
          pip install .[doc,recommended,test,dev]
      - name: Cache Mitsuba build artefacts
        id: cache-mi-build
        uses: actions/cache@v4
        with:
          path: ext/mitsuba/build
      - name: Build kernel
        if: steps.cache-mi-build.outputs.cache-hit != 'true'
        run: |
          export CC=clang-17 export CXX=clang++-17
          cmake -S ext/mitsuba -B ext/mitsuba/build -DCMAKE_BUILD_TYPE=Release -GNinja --preset eradiate
          cmake --build ext/mitsuba/build
      - name: Set Paths
        run: |
          source setpath.sh
      - name: Download datasets
        run: |
          eradiate data fetch minimal
      - name: Run fast tests
        run: |
          pytest --robot-tagstatinclude unit --robot-tagstatinclude system --robot-tagstatinclude regression --robot-tagstatinclude slow -m "not slow" ./tests
      - name: Setup chrome
        if: always()
        uses: browser-actions/setup-chrome@v1
      - name: Robot report
        if: always()
        run: |
          rebot --expandkeywords name:* ./output.xml
          chrome --no-sandbox --virtual-time-budget=10000 --headless --print-to-pdf=./log.pdf    ./log.html    --no-pdf-header-footer
          chrome --no-sandbox --virtual-time-budget=10000 --headless --print-to-pdf=./report.pdf ./report.html --no-pdf-header-footer
      - name: Save HTML log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log_html
          path: ./log.html
      - name: Save HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report_html
          path: ./report.html
      - name: Save PDF log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log_pdf
          path: ./log.pdf
      - name: Save PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report_pdf
          path: ./report.pdf
      - name: Save test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output_xml
          path: ./output.xml
